# Local hooks. Wired in:
#
# 1. ``pytest-coverage`` runs the full pytest + 100% coverage gate on every
#    ``git push``. One-time setup (after ``uv sync --group dev``):
#
#        uv run pre-commit install --hook-type pre-push
#
# 2. ``changelog-lint`` validates beetroot invocations cited in fenced
#    shell blocks AND prose-inline backtick spans under ``## Unreleased``
#    of ``CHANGELOG.md``. It runs on pre-commit when CHANGELOG.md OR
#    ``src/beetroot/cli.py`` is touched (T3: a verb-renaming commit
#    must invalidate the linter too) and is also runnable as
#    ``pre-commit run --hook-stage manual changelog-lint`` for the CI
#    mirror.
#
# 3. ``interrogate`` keeps docstring coverage above 95% on
#    ``src/beetroot/``. Fast enough to run every commit; the
#    matching CI gate provides defence-in-depth.
repos:
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest with 100% coverage gate
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: changelog-lint
        name: lint beetroot invocations under Unreleased
        entry: uv run python scripts/lint_changelog.py
        language: system
        # T3: a verb-renaming commit in cli.py must invalidate the
        # linter too, otherwise the CHANGELOG entry that cites the
        # old name sails through.
        files: ^(CHANGELOG\.md|src/beetroot/cli\.py)$
        pass_filenames: false
        stages: [pre-commit, manual]
        verbose: true

      - id: interrogate
        name: interrogate (>=95% docstring coverage)
        entry: uv run interrogate src/beetroot/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, manual]
        verbose: true
