# Documentation only — not loaded by the CLI. Copy this over your fresh beetroot.yaml if you want this configuration.
# Beetroot baseline research phone — GMS denylisted from Magisk root.
# Every field except android.version is optional; schema defaults apply when omitted.
# Edit beetroot.yaml in your instance dir and run `beetroot apply` to re-stage.

api_version: 2

android:
  version: 14

stealth:
  denylist:
    - com.google.android.gms
    - com.google.android.gms.unstable
