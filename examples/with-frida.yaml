# Documentation only — not loaded by the CLI. Copy this over your fresh beetroot.yaml if you want this configuration.
# Beetroot baseline + explicit, version-pinned frida-server.
# Pin frida.version to match your host-side frida-tools (major + minor must agree).
# Drop the `frida:` block (or copy examples/default.yaml) to disable frida entirely.

api_version: 3

android:
  version: 14

frida:
  version: "16.4.10"

stealth:
  denylist:
    - com.google.android.gms
    - com.google.android.gms.unstable
