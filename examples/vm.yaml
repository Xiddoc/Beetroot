# Documentation only — not loaded by the CLI. Copy this over your fresh beetroot.yaml if you want this configuration.
# Run redroid inside an emulated QEMU micro-VM that ships its own
# binder-enabled kernel — for hosts with no kernel binder driver (hardened
# CI, nomodule cloud sandboxes). Build the guest artifacts once with
# `beetroot build --vm-kernel`, then `beetroot apply` + `beetroot up`.
#
# accel: auto prefers KVM when /dev/kvm is available (near-native) and
# falls back to TCG (software emulation, ~5-20x slower) otherwise. A slow
# first boot under TCG is expected, not a hang.

api_version: 4

binder: vm

vm:
  kernel: ~/.cache/beetroot/vm/bzImage
  rootfs: ~/.cache/beetroot/vm/rootdisk.img
  accel: auto
  # smp: auto (the default) sizes -smp to the host's usable CPU count, which
  # the vm-rnd-log §B.5 sweep found is the optimum for the redroid boot (it
  # scales with vCPUs up to the host core count, then regresses). Pin an
  # explicit integer to leave host cores free or to override the auto-size.
  smp: auto
  memory_mib: 8192
