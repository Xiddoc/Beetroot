# Documentation only — not loaded by the CLI. Copy this over your fresh beetroot.yaml if you want this configuration.
# Run redroid inside an emulated QEMU micro-VM that ships its own
# binder-enabled kernel — for hosts with no kernel binder driver (hardened
# CI, nomodule cloud sandboxes). Build the guest artifacts once with
# `beetroot build --vm-kernel`, then `beetroot apply` + `beetroot up`.
#
# accel: auto prefers KVM when /dev/kvm is available (near-native) and
# falls back to TCG (software emulation, ~5-20x slower) otherwise. A slow
# first boot under TCG is expected, not a hang.
#
# Faster TCG iteration: the default Android version is 14, which cold-boots in
# ~190-200 s under TCG; redroid 11 boots in ~100 s (~40% faster) on the same
# host. If you don't need Android-14 APIs, set `android: {version: 11}` and
# rebuild the guest with `beetroot build --vm-kernel`. Either way, the
# `vm.boot_cache` warm-start below collapses repeat boots to ~10 s — see
# docs/design/vm-rnd-log.md (Stage E).

api_version: 8

binder: vm

android:
  # binder: vm boots an unmodified upstream redroid image — it has no GApps,
  # Magisk, or Houdini layer. Pin gapps: none so the config matches what the
  # VM actually runs; any other value is silently inert here and beetroot
  # apply (or register) will warn about it once at config time (see issue #104).
  gapps: none

vm:
  kernel: ~/.cache/beetroot/vm/bzImage
  rootfs: ~/.cache/beetroot/vm/rootdisk.img
  accel: auto
  # smp: auto (the default) pins -smp to the host's PHYSICAL core count (HT
  # siblings collapsed, capped by CPU affinity). The vm-rnd-log §B.5 sweep
  # found matching physical cores is the optimum for the redroid boot (more
  # vCPUs than physical cores oversubscribe the emulator). Pin an integer to
  # leave host cores free or override the auto-size.
  smp: auto
  memory_mib: 8192
  # boot_cache: true checkpoints the booted guest once (QEMU savevm) and
  # RESUMES it (-loadvm) on every later `up` — ~10 s vs ~3-4 min cold under
  # TCG (a ~22x speedup). Resume reverts to the checkpoint each time (a fast
  # known-good boot, not persistence); delete <instance>/vm-overlay.qcow2 to
  # reset after rebuilding the kernel/rootfs. Requires qemu-img.
  boot_cache: false
