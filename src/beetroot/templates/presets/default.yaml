# Beetroot default preset — baseline research phone.
# Every field except android.version is optional; schema defaults apply when omitted.
# Edit beetroot.yaml in your instance dir and run `beetroot apply` to re-stage.
#
# Frida is opt-in: this preset deliberately omits the `frida:` block, so no
# frida-server binary is downloaded or launched. Copy presets/with-frida.yaml
# (or add `frida: {version: "16.4.10"}` here) to enable it.

api_version: 2

android:
  version: 14

stealth:
  denylist:
    - com.google.android.gms
    - com.google.android.gms.unstable
