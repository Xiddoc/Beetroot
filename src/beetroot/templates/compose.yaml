services:
  phone:
    container_name: ${INSTANCE_NAME}
    build:
      context: ${BEETROOT_BUILD_CONTEXT:-.}
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-redroid/redroid:14.0.0_litegapps_houdini_magisk}
    image: beetroot:latest
    privileged: true
    restart: unless-stopped

    mem_limit: ${MEM_LIMIT:-3g}
    mem_reservation: ${MEM_RESERVATION:-${MEM_LIMIT:-3g}}
    memswap_limit: ${MEMSWAP_LIMIT:-${MEM_LIMIT:-3g}}
    cpus: ${CPUS:-2.0}
    shm_size: ${SHM_SIZE:-256m}
    pids_limit: ${PIDS_LIMIT:-4096}

    volumes:
      - ./data:/data
      - ./modules:${BEETROOT_MODULES_DIR:-/data/adb/modules_update}:ro
      - ./frida-server:${BEETROOT_FRIDA_BIN:-/data/local/tmp/frida-server}:ro

    # Host overrides for the boot-time helper scripts' container paths.
    # Defaults shown here mirror the helper's own shell-default fallback
    # so a missing value in the rendered .env (e.g. a hand-driven
    # ``docker compose`` invocation without a Beetroot-rendered .env file)
    # still boots the container the same way as ``render_env`` would.
    # BEETROOT_DENYLIST_PACKAGES is a comma-separated list consumed by
    # magisk-config.sh via ``IFS=,``; defaults to the GMS pair (Magisk.denylist
    # default) so root is hidden from GMS unless overridden.
    environment:
      BEETROOT_MAGISK_DB: ${BEETROOT_MAGISK_DB:-/data/adb/magisk.db}
      BEETROOT_MODULES_DIR: ${BEETROOT_MODULES_DIR:-/data/adb/modules_update}
      BEETROOT_FRIDA_BIN: ${BEETROOT_FRIDA_BIN:-/data/local/tmp/frida-server}
      BEETROOT_DENYLIST_PACKAGES: ${BEETROOT_DENYLIST_PACKAGES:-}

    ports:
      - "${ADB_PORT}:5555"
      - "${FRIDA_PORT}:27042"
      - "${FRIDA_PORT_CONTROL}:27043"

    command:
      - androidboot.redroid_width=${DISPLAY_WIDTH:-540}
      - androidboot.redroid_height=${DISPLAY_HEIGHT:-960}
      - androidboot.redroid_fps=${DISPLAY_FPS:-3}
      - androidboot.redroid_gpu_mode=${DISPLAY_GPU:-host}
      - androidboot.use_memfd=true
      - androidboot.use_redroid_overlayfs=true
