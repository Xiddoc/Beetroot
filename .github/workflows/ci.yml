name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: Ruff check
        run: uv run ruff check src/beetroot/ tests/

      - name: Ensure arbitrary_types_allowed is never used
        run: |
          ! grep -rn 'arbitrary_types_allowed' src/ tests/ pyproject.toml

      - name: Mypy (src + tests — both must type-check per CLAUDE.md)
        run: uv run mypy src/beetroot/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: Pytest (100% coverage gate enforced via [tool.coverage.report])
        run: uv run pytest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck (POSIX sh — boot helpers run under /system/bin/sh)
        run: shellcheck -s sh docker/*.sh
