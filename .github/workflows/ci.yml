name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

# T3 hardening: every third-party action is SHA-pinned (with the
# version tag in a trailing comment) so a compromised tag can't
# silently swap in a malicious workflow. ``actions/checkout@v6.0.3``
# and ``astral-sh/setup-uv@v8.2.0`` are the floors as of the Node 24
# migration (issue #40); bump SHAs in lockstep when upgrading versions.

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: uv lock check (pyproject.toml / uv.lock drift gate)
        run: uv lock --check

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: Ruff check
        run: uv run ruff check src/beetroot/ tests/ scripts/

      - name: Ruff format check (src/beetroot/ stays formatter-clean)
        run: uv run ruff format --check src/beetroot/

      - name: Ensure arbitrary_types_allowed is never used
        run: |
          ! grep -rn 'arbitrary_types_allowed' src/ tests/ pyproject.toml

      - name: Mypy (src + tests + scripts — all must type-check)
        run: uv run mypy src/beetroot/ tests/ scripts/

      - name: Pyright (second-opinion type-checker; mypy is the primary)
        run: uv run pyright src/ tests/

      - name: Changelog-lint (beetroot invocations under Unreleased)
        run: uv run python scripts/lint_changelog.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: Pytest (100% line+branch coverage gate)
        # ``-p no:cacheprovider`` keeps CI runs stateless — no
        # ``.pytest_cache`` is written, so nothing can leak between
        # runs or into a cached workspace.
        run: uv run pytest --cov-fail-under=100 --cov-report=xml -p no:cacheprovider

      - name: Render terminal coverage report for the artifact
        run: uv run coverage report --show-missing > coverage-term.txt

      - name: Upload coverage artifact (XML + terminal report)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage-term.txt
          retention-days: 14

  docstring-and-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: Interrogate (>=95% docstring coverage on src/beetroot/)
        run: uv run interrogate src/beetroot/

      - name: Radon (no function grade C or worse)
        run: uv run radon cc src/ -n C --total-average

      - name: Vulture (dead-code finder; allowlist in pyproject.toml)
        run: uv run vulture src/beetroot/

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: pip-audit (dependency CVE scan)
        # PYSEC-2022-42969 is in the ``py`` 1.11.0 transitive dep of
        # interrogate; the affected code path (svnwc) is not used by
        # Beetroot or interrogate. Track it and drop the suppression
        # if/when interrogate upgrades.
        # PYSEC-2026-196 is in ``pip`` itself (the build tool, fixed in
        # pip 26.1.2) — an environment package, not a Beetroot runtime
        # dependency. Drop the suppression once the runner ships pip
        # >=26.1.2.
        run: uv run pip-audit --ignore-vuln PYSEC-2022-42969 --ignore-vuln PYSEC-2026-196

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck -S warning (POSIX sh — boot helpers run under /system/bin/sh)
        run: shellcheck -S warning -s sh docker/*.sh

  shfmt:
    # Formatting gate for the boot helpers (issue #21). The binary is a
    # pinned release download with a checksum check — same supply-chain
    # posture as the SHA-pinned actions above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install shfmt v3.13.1 (pinned release binary, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  $RUNNER_TEMP/shfmt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/shfmt"

      - name: shfmt diff gate (4-space indent, matching the tree)
        run: '"$RUNNER_TEMP/shfmt" -i 4 -d docker/*.sh'

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: docker/Dockerfile
          # DL3006/DL3007 = "always tag the version of an image
          # explicitly". Our base is ``FROM ${BASE_IMAGE}`` — a build
          # arg supplied and tagged at build time (defaulting to
          # ``redroid/redroid:14.0.0_litegapps_houdini_magisk`` and
          # resolved by ``beetroot build``). hadolint can't see the tag
          # behind the arg, so we whitelist both rules.
          ignore: DL3006,DL3007

  docker-build-smoke:
    # Validates that the Dockerfile's structure and COPY instructions are
    # buildable without pulling the multi-GB redroid base image. GitHub
    # runners lack KVM/nested-virt, so we cannot boot the real Android
    # stack in CI — this job passes a lightweight busybox stand-in via
    # ``--build-arg BASE_IMAGE=busybox`` to prove the COPY layers compile.
    # The built image is uploaded as a workflow artifact so it can be
    # inspected when the job is green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Build image (busybox stand-in base)
        run: |
          docker build \
            --build-arg BASE_IMAGE=busybox \
            -f docker/Dockerfile \
            -t beetroot-ci-smoke:${{ github.sha }} \
            .

      - name: Export image as tarball
        run: docker save beetroot-ci-smoke:${{ github.sha }} | gzip > beetroot-ci-smoke.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: beetroot-ci-smoke-${{ github.sha }}
          path: beetroot-ci-smoke.tar.gz
          retention-days: 3

  docs-strict:
    # CR #4: docs.yml's --strict build only ran on push-to-master, so PRs
    # could land doc drift (broken xrefs, stray nav entries) without failing
    # any check. This job validates the same build on every PR, but does
    # not deploy — the gh-pages deploy still lives in docs.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --group docs --frozen

      - name: Build docs (strict mode — any warning fails the PR check)
        run: uv run mkdocs build --strict

  workflow-lint:
    # Lints the CI definitions themselves (issue #21). actionlint checks
    # workflow syntax, expression types, and the shell in run blocks;
    # zizmor audits for security smells (unpinned actions, credential
    # persistence, excessive permissions). actionlint is a pinned release
    # download with a checksum check; zizmor is version-pinned via uvx.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install actionlint v1.7.12 (pinned release binary, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          echo "$sum  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/actionlint.tar.gz" actionlint

      - name: actionlint (workflow syntax + type checks)
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: zizmor (workflow security audit)
        run: uvx zizmor==1.25.2 .github/workflows/

  hygiene:
    # Cross-cutting hygiene gates (issue #21), all run from uvx with
    # explicit version pins so the job needs no project install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Codespell (src, docs, README, CHANGELOG)
        run: uvx codespell==2.4.2 src/ docs/ README.md CHANGELOG.md

      - name: Yamllint (compose template, workflows, examples — policy in .yamllint)
        run: >
          uvx yamllint==1.38.0 -c .yamllint
          src/beetroot/templates/compose.yaml .github/workflows/ examples/

      - name: Deptry (dependency hygiene — config in pyproject.toml)
        run: uvx deptry==0.25.1 .

  packaging:
    # Packaging gate (issue #21): the wheel must build, pass twine's
    # metadata checks, and install + run in a clean venv — proving the
    # published artifact works outside the dev tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Build sdist + wheel
        run: uv build

      - name: Twine check (metadata renders on PyPI)
        run: uvx twine==6.2.0 check dist/*

      - name: Install wheel into a clean venv and smoke-test the CLI
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/beetroot" --help
