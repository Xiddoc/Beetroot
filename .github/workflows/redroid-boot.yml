name: redroid-boot

# Boots a real redroid Android-14 container on a hosted runner to prove the
# "binder in CI" path documented in docs/guides/running-in-ci.md. Hosted
# ubuntu runners give us sudo and a kernel that provides binder (built-in
# binderfs and/or the loadable binder_linux module), so we can boot redroid
# headless, wait for sys.boot_completed, and then drive the device through
# Beetroot's adb backend. The stock redroid image is used deliberately: the
# multi-GB gapps/houdini/magisk image that `beetroot build` produces is too
# heavy for a hosted runner's time + disk budget, and booting stock redroid is
# enough to prove the kernel + container path works end to end.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Provide the binder driver to the host
        # Best-effort: a modern hosted-runner kernel exposes binderfs (which
        # redroid mounts itself inside the privileged container), and the
        # binder_linux module is shipped in linux-modules-extra. We try both
        # and never hard-fail here — the boot-wait step below is the real gate,
        # and `docker logs` (always) surfaces a binder failure if it happens.
        run: |
          set -uxo pipefail
          sudo apt-get update || true
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          if [ ! -e /dev/binder ]; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs || true
          fi
          echo "binder device nodes / binderfs:"
          ls -l /dev/binder /dev/hwbinder /dev/vndbinder /dev/binderfs 2>/dev/null || true
          grep -i binder /proc/filesystems || true

      - name: Install adb
        run: sudo apt-get install -y android-tools-adb

      - name: Boot stock redroid (Android 14, headless, software GPU)
        run: |
          set -euxo pipefail
          docker run -d --privileged --name redroid \
            -p 5555:5555 \
            redroid/redroid:14.0.0_64only-latest \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_fps=15

      - name: Wait for Android boot to complete
        run: |
          set -uxo pipefail
          adb connect localhost:5555
          adb wait-for-device
          booted=
          for _ in $(seq 1 100); do
            booted="$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 3
          done
          if [ "$booted" != "1" ]; then
            echo "::error::Android did not finish booting within the timeout"
            exit 1
          fi
          echo "Android release: $(adb -s localhost:5555 shell getprop ro.build.version.release | tr -d '\r')"

      - name: Drive the booted device with Beetroot (adb backend)
        run: |
          set -euxo pipefail
          adb connect localhost:5555
          uv run beetroot adopt localhost:5555 --name ci --verify
          uv run beetroot ls
          uv run beetroot shell ci -c 'getprop sys.boot_completed'

      - name: redroid container logs (always, for diagnosis)
        if: always()
        run: docker logs redroid 2>&1 | tail -n 200 || true

      - name: Teardown
        if: always()
        run: docker rm -f redroid || true
