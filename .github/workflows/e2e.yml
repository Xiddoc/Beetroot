name: e2e

# End-to-end tests that boot a real Android on a hosted runner. These are the
# behavioural counterpart to the (fast, kernel-less) unit suite in ci.yml:
# they prove the deployment + boot + in-device behaviour that only a running
# Android can exercise.
#
# Three tiers (see docs/guides/running-in-ci.md):
#   * Tier 1 (implemented): boot the upstream stock redroid image and drive it
#     through Beetroot's adb backend. Light (~1-2 min), reliable. Covers the
#     adopt / ls / shell / doctor(adb-side) paths against a real device.
#   * Tier 2 (scaffold, WIP): `beetroot build` the real Magisk image, `beetroot
#     up` it, and assert root / Zygisk / denylist / Frida / modules. Heavy and
#     still being hardened, so it is non-blocking (continue-on-error) and runs
#     only on the nightly schedule or an explicit dispatch.
#   * Tier-VM (implemented): build the binder-enabled guest kernel + rootfs and
#     boot redroid inside the `binder: vm` QEMU micro-VM, then drive it through
#     the adb backend. The only CI path that exercises the vm engine end-to-end
#     (the unit suite covers it with mocks). Slow under TCG (~100s+ boot).
#
# Triggers: manual dispatch, a nightly schedule (master), and pull requests
# carrying the `e2e` label (so the heavy boots don't run on every push).

on:
  workflow_dispatch:
    inputs:
      run_tier2:
        description: "Also run the heavy Tier 2 (beetroot build + boot the Magisk image)"
        type: boolean
        default: false
      run_lsposed:
        description: "Also run the LSPosed module-hook e2e (build image, flash Vector, assert a hook fires)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1-stock-redroid:
    # Runs on dispatch / schedule always; on a PR only when it carries `e2e`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: ./.github/actions/provide-binder

      - name: Install adb
        run: sudo apt-get install -y android-tools-adb

      - name: Boot stock redroid (Android 14, headless, software GPU)
        run: |
          set -euxo pipefail
          docker run -d --privileged --name redroid \
            -p 5555:5555 \
            redroid/redroid:14.0.0_64only-latest \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_fps=15

      - name: Wait for Android boot to complete
        run: |
          set -uxo pipefail
          adb connect 127.0.0.1:5555
          adb -s 127.0.0.1:5555 wait-for-device
          booted=
          for _ in $(seq 1 100); do
            booted="$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 3
          done
          if [ "$booted" != "1" ]; then
            echo "::error::Android did not finish booting within the timeout"
            exit 1
          fi
          echo "Android release: $(adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tr -d '\r')"

      - name: Drive the booted device with Beetroot and assert
        run: |
          set -euxo pipefail
          adb connect 127.0.0.1:5555
          uv run beetroot adopt 127.0.0.1:5555 --name ci --verify
          uv run beetroot ls --json | tee /tmp/ls.json
          test "$(jq -r '.ci.kind' /tmp/ls.json)" = "adb"
          test "$(jq -r '.ci.is_available' /tmp/ls.json)" = "true"
          # Drive a one-shot command through Beetroot's shell verb.
          boot_prop="$(uv run beetroot shell ci getprop sys.boot_completed | tr -d '\r')"
          test "$boot_prop" = "1"
          # doctor's adb-side check must pass against a real device. The
          # magisk / frida rows fail on stock redroid (no root, no frida-server),
          # so the verb exits non-zero — assert only the adb.serial row here.
          doctor_out="$(uv run beetroot doctor ci || true)"
          echo "$doctor_out"
          echo "$doctor_out" | grep -q 'adb.serial: pass'

      - name: redroid container logs (always, for diagnosis)
        if: always()
        run: docker logs redroid 2>&1 | tail -n 200 || true

      - name: Teardown
        if: always()
        run: docker rm -f redroid || true

  tier2-beetroot-image:
    # WIP scaffold: builds the real Magisk image and boots it via `beetroot up`,
    # then asserts the in-device deployment (root, Zygisk, denylist, Frida).
    # The build is heavy and still being hardened, so this is non-blocking and
    # runs only nightly or on an explicit `run_tier2` dispatch.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tier2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: ./.github/actions/provide-binder

      - name: Install adb
        run: sudo apt-get install -y android-tools-adb

      - name: Build the Beetroot Magisk image (no gapps — lightest variant)
        run: uv run beetroot build none

      - name: Create and boot a Beetroot instance
        run: |
          set -euxo pipefail
          uv run beetroot create e2e-phone
          uv run beetroot up e2e-phone

      - name: Wait for Android boot + Magisk daemon
        run: |
          set -uxo pipefail
          # Index 0 → host ADB port 5555 (see src/beetroot/ports.py).
          adb connect 127.0.0.1:5555
          adb -s 127.0.0.1:5555 wait-for-device
          booted=
          for _ in $(seq 1 120); do
            booted="$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "::error::Android did not finish booting within the timeout"
            exit 1
          fi
          # Wait for MagiskSU to grant root (entrypoint.sh enables it post-boot).
          for _ in $(seq 1 60); do
            if adb -s 127.0.0.1:5555 shell su -c id 2>/dev/null | grep -q 'uid=0'; then
              break
            fi
            sleep 5
          done

      - name: Assert the in-device deployment
        run: |
          set -euxo pipefail
          # Root via MagiskSU.
          adb -s 127.0.0.1:5555 shell su -c id | grep -q 'uid=0'
          # Zygisk enabled + GMS denylisted + frida reachable — exactly what
          # `beetroot doctor` checks. On the real image every row should pass.
          uv run beetroot doctor e2e-phone
          # magisk-env.sh must have populated MAGISKBIN headlessly — without
          # /data/adb/magisk/util_functions.sh every `magisk --install-module`
          # aborts with "Incomplete Magisk install" (the gap behind a broken
          # declarative module flow). This is the regression guard for it.
          adb -s 127.0.0.1:5555 shell su -c 'test -f /data/adb/magisk/util_functions.sh'

      - name: Assert a module flashes end-to-end (the declarative flow)
        run: |
          set -euxo pipefail
          # Stage a trivial no-op Magisk module and prove it installs via the
          # exact primitive flash-modules.sh uses. This is what actually
          # exercises the populated MAGISKBIN (the doctor checks above do not).
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/noop"
          cat > "$workdir/noop/module.prop" <<'EOF'
          id=beetroot_e2e_noop
          name=Beetroot E2E No-op
          version=1.0
          versionCode=1
          author=beetroot
          description=Trivial module proving the declarative flash flow works.
          EOF
          (cd "$workdir/noop" && zip -r ../noop.zip .)
          adb -s 127.0.0.1:5555 push "$workdir/noop.zip" /data/local/tmp/noop.zip
          adb -s 127.0.0.1:5555 shell su -c 'magisk --install-module /data/local/tmp/noop.zip'
          adb -s 127.0.0.1:5555 shell su -c 'test -d /data/adb/modules/beetroot_e2e_noop'

      - name: Beetroot + container logs (always, for diagnosis)
        if: always()
        run: |
          uv run beetroot logs e2e-phone 2>&1 | tail -n 200 || true

      - name: Teardown
        if: always()
        run: uv run beetroot destroy e2e-phone -y || true

  tier-lsposed-hook:
    # WIP scaffold (non-blocking): the full LSPosed module-hook e2e. Builds the
    # Magisk image, flashes Vector (LSPosed) declaratively, then installs the
    # bundled Xposed hook-test module, enables it in scope, and asserts a real
    # method hook fired (BEETROOT_HOOK_FIRED). Verified locally on the binder:vm
    # TCG VM; this runs the same `scripts/lsposed-hook-e2e.sh` flow on host
    # binder. Heavy (multiple boots), so schedule / explicit dispatch only.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_lsposed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      ADB: 127.0.0.1:5555
      TARGET: com.android.settings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: ./.github/actions/provide-binder

      - name: Install adb
        run: sudo apt-get install -y android-tools-adb

      - name: Build the Beetroot Magisk image (no gapps — lightest variant)
        run: uv run beetroot build none

      - name: Create instance with Vector (LSPosed) flashed declaratively
        run: |
          set -euxo pipefail
          uv run beetroot create lsposed-phone
          # Vector module (matches examples/lsposed.yaml) + gapps:none to match
          # the `build none` image tag.
          cat > lsposed-phone/beetroot.yaml <<'EOF'
          api_version: 4
          android:
            version: 14
            gapps: none
          modules:
            - url: https://github.com/JingMatrix/Vector/releases/download/v2.0/Vector-v2.0-3021-Release.zip
              sha256: d5e39669c02c2c699ab948eb8f3639b348eefb7749553224a9c62fa4a2f2dc18
          magisk:
            denylist:
              - com.google.android.gms
              - com.google.android.gms.unstable
          EOF
          uv run beetroot apply lsposed-phone
          uv run beetroot up lsposed-phone

      - name: Boot, then restart (2nd boot activates Zygisk + Vector)
        run: |
          set -uxo pipefail
          wait_boot() {
            adb connect "$ADB"; adb -s "$ADB" wait-for-device
            for _ in $(seq 1 120); do
              [ "$(adb -s "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && return 0
              sleep 5
            done
            echo "::error::Android did not boot in time"; return 1
          }
          wait_boot
          # A Zygisk module goes live on the SECOND boot (magiskd reads the
          # persisted zygisk=1 at post-fs-data and injects zygote at first start).
          uv run beetroot restart lsposed-phone
          wait_boot
          adb -s "$ADB" root || true; sleep 3; adb connect "$ADB" || true
          # Vector's lspd daemon must be running.
          for _ in $(seq 1 30); do
            adb -s "$ADB" shell 'ps -A' 2>/dev/null | grep -q '[l]spd' && break
            sleep 5
          done
          adb -s "$ADB" shell 'ps -A' | grep '[l]spd'

      - name: Install the hook module + enable it in scope
        run: |
          set -euxo pipefail
          scripts/lsposed-hook-e2e.sh setup "$ADB" \
            tests/fixtures/xposed-hook-module/beetroot-hook-test.apk "$TARGET"
          # lspd loads newly-scoped modules at daemon start → reboot to apply.
          uv run beetroot restart lsposed-phone

      - name: Assert a real module hook fired
        run: |
          set -uxo pipefail
          adb connect "$ADB"; adb -s "$ADB" wait-for-device
          for _ in $(seq 1 120); do
            [ "$(adb -s "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          scripts/lsposed-hook-e2e.sh check "$ADB" "$TARGET"

      - name: Beetroot + container logs (always, for diagnosis)
        if: always()
        run: uv run beetroot logs lsposed-phone 2>&1 | tail -n 200 || true

      - name: Teardown
        if: always()
        run: uv run beetroot destroy lsposed-phone -y || true

  tier-vm-qemu:
    # Boots the real `binder: vm` QEMU micro-VM backend and drives it through
    # the adb backend (issue #48). This is the only path that exercises the vm
    # engine end-to-end; the unit suite covers it only with mocks. Gated like
    # tier1 (schedule / dispatch / PR `e2e` label) — boots are slow.
    #
    # GitHub-hosted runners have no /dev/kvm, so detect_accel() picks TCG here
    # (~5-20x slower; a ~100s+ boot is expected, not a hang — see
    # docs/design/vm-rnd-log.md). On a KVM-capable runner class accel: auto
    # would pick KVM for free. The kernel+rootfs build is the long pole; the
    # savevm boot-cache (#49) is the planned lever to skip it on repeat runs.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The binder-enabled guest kernel pinned by docs/design/vm-rnd-log.md.
      KERNEL_VERSION: "6.12.9"
      VM_OUT: ${{ github.workspace }}/vm-artifacts
      BEETROOT_VM_KERNEL: ${{ github.workspace }}/vm-artifacts/bzImage
      BEETROOT_VM_ROOTFS: ${{ github.workspace }}/vm-artifacts/rootdisk.img
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install QEMU, adb, the kernel toolchain, ccache, and rootfs host deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 android-tools-adb ccache \
            build-essential flex bison libelf-dev libssl-dev bc cpio \
            busybox-static e2fsprogs xz-utils iptables socat

      - name: Install Beetroot
        run: uv sync --frozen

      # ccache makes the guest-kernel re-compile near-free on repeat runs
      # (cold ~7-9 min -> warm ~1 min). Keyed on the kernel version + config
      # fragment, so a kernel/config bump correctly misses and recompiles.
      - name: Cache ccache (guest-kernel compile)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/ccache
          key: >-
            ${{ runner.os }}-ccache-vmkernel-${{ env.KERNEL_VERSION }}-${{
            hashFiles('src/beetroot/templates/vm/kernel.config') }}
          restore-keys: |
            ${{ runner.os }}-ccache-vmkernel-${{ env.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-vmkernel-

      - name: Build the binder-enabled guest kernel (ccache-accelerated)
        run: |
          set -euxo pipefail
          mkdir -p "$VM_OUT"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
          tar -xf "linux-${KERNEL_VERSION}.tar.xz"
          cd "linux-${KERNEL_VERSION}"
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/src/beetroot/templates/vm/kernel.config"
          make olddefconfig
          make CC="ccache gcc" -j"$(nproc)" bzImage
          cp arch/x86/boot/bzImage "$VM_OUT/bzImage"
          grep -q 'CONFIG_ANDROID_BINDER_IPC=y' .config
          ccache --show-stats | grep -iE 'hits|misses' || true

      - name: Assemble the guest rootfs (busybox + Docker static + redroid)
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from beetroot.builder import build_rootfs

          build_rootfs(
              out_image=Path(os.environ["VM_OUT"]) / "rootdisk.img",
              vm_dir=Path("src/beetroot/templates/vm"),
          )
          PY

      - name: "Create + boot a binder:vm instance under QEMU/TCG"
        run: |
          set -euxo pipefail
          uv run beetroot create vmphone
          printf 'binder: vm\n' >> vmphone/beetroot.yaml
          # `apply` switches the registered backend to the micro-VM engine;
          # `up` refuses a binder:vm instance still registered as redroid.
          uv run beetroot apply vmphone
          uv run beetroot up vmphone

      - name: "Wait for Android boot (TCG: slow, not hung)"
        run: |
          set -uxo pipefail
          # Index 0 -> host ADB port 5555 (src/beetroot/ports.py); the VM
          # forwards the guest's adbd there.
          adb connect 127.0.0.1:5555
          adb -s 127.0.0.1:5555 wait-for-device
          booted=
          for _ in $(seq 1 200); do
            booted="$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$booted" = "1" ] && break
            sleep 5
          done
          [ "$booted" = "1" ] || { echo "::error::vm guest did not boot in time"; exit 1; }

      - name: Drive the VM through Beetroot and assert
        run: |
          set -euxo pipefail
          uv run beetroot ls --json | tee /tmp/ls.json
          test "$(jq -r '.vmphone.is_available' /tmp/ls.json)" = "true"
          boot_prop="$(uv run beetroot shell vmphone getprop sys.boot_completed | tr -d '\r')"
          test "$boot_prop" = "1"
          # doctor's vm.* rows must report the running QEMU process + accel.
          doctor_out="$(uv run beetroot doctor vmphone || true)"
          echo "$doctor_out"
          echo "$doctor_out" | grep -q 'vm.process: pass'
          echo "$doctor_out" | grep -qE 'vm.accel: (pass|skip)'

      - name: Frida over the VM is intentionally unsupported (assert the message)
        run: |
          set -uxo pipefail
          # frida-addr fails loudly (exit 2) on the vm backend rather than
          # emitting an address — assert the friendly message (issue #109).
          out="$(uv run beetroot frida-addr vmphone 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -qi 'not yet supported'

      - name: Guest serial log (always, for diagnosis)
        if: always()
        run: |
          uv run beetroot logs vmphone 2>&1 | tail -n 200 || true

      - name: Teardown
        if: always()
        run: uv run beetroot destroy vmphone -y || true

  tier-reusable-workflow:
    # Smoke-test the *product* — the reusable workflow external repos consume
    # (.github/workflows/beetroot-ci.yml). Calls it against this repo with a
    # trivial test-command that asserts the booted device reports
    # sys.boot_completed=1, proving the consumer-facing path end-to-end. Gated
    # like tier1 (schedule / dispatch / PR `e2e` label) — it runs a full host
    # boot, so it is not a per-push gate.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/beetroot-ci.yml
    with:
      binder: host
      gapps: none
      instance-name: smoke
      test-command: |
        set -euo pipefail
        booted="$(adb -s "$ADB_SERIAL" shell getprop sys.boot_completed | tr -d '\r')"
        test "$booted" = "1"
        echo "reusable-workflow smoke: device booted (sys.boot_completed=$booted)"
