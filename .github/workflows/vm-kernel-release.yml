---
# Publishes a prebuilt binder: vm guest kernel so fresh hosts (CI runners,
# Claude Code on the web sandboxes) can `beetroot build --vm-kernel` and fetch
# a ~12 MiB bzImage in seconds instead of compiling for ~7 min.
#
# The asset is named bzImage-<version>-<config-fingerprint>; the CLI
# (beetroot.kernel_download) computes the same fingerprint from its local
# docker/vm/kernel.config and only fetches an exact match — so a config edit
# correctly misses and the CLI falls back to a source compile. Runs on demand
# and whenever the config fragment changes on master.
name: vm-kernel-release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - docker/vm/kernel.config
      - .github/workflows/vm-kernel-release.yml

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # create/upload the rolling 'vm-kernel' release asset
    env:
      # Keep in sync with KERNEL_VERSION in src/beetroot/builder.py and e2e.yml.
      KERNEL_VERSION: "6.12.9"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install the kernel toolchain + ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc cpio xz-utils ccache

      - name: Cache ccache (guest-kernel compile)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-vmkernel-${{ env.KERNEL_VERSION }}-${{ hashFiles('docker/vm/kernel.config') }}
          restore-keys: |
            ${{ runner.os }}-ccache-vmkernel-${{ env.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-vmkernel-

      - name: Build the binder-enabled bzImage
        run: |
          set -euxo pipefail
          fp="$(sha256sum docker/vm/kernel.config | cut -c1-12)"
          asset="bzImage-${KERNEL_VERSION}-${fp}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
          tar -xf "linux-${KERNEL_VERSION}.tar.xz"
          cd "linux-${KERNEL_VERSION}"
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/docker/vm/kernel.config"
          make olddefconfig
          make CC="ccache gcc" -j"$(nproc)" bzImage
          grep -q 'CONFIG_ANDROID_BINDER_IPC=y' .config
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/${asset}"
          cd "$GITHUB_WORKSPACE"
          sha256sum "${asset}" >"${asset}.sha256"
          echo "ASSET=${asset}" >>"$GITHUB_ENV"

      - name: Publish to the rolling vm-kernel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          notes="Prebuilt bzImage assets fetched by 'beetroot build --vm-kernel',"
          notes="${notes} named bzImage-<version>-<config-fingerprint>."
          gh release view vm-kernel >/dev/null 2>&1 || gh release create vm-kernel \
            --title "Prebuilt binder: vm guest kernels" --notes "${notes}"
          gh release upload vm-kernel "${ASSET}" "${ASSET}.sha256" --clobber
