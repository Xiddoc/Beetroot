---
# Publishes a prebuilt binder: vm guest kernel so fresh hosts (CI runners,
# Claude Code on the web sandboxes) can `beetroot build --vm-kernel` and fetch
# a ~12 MiB bzImage in seconds instead of compiling for ~7 min.
#
# Each kernel gets its own release tagged vm-kernel-<version>-<config-fingerprint>
# with the bzImage + .sha256 attached AT creation — which keeps publishing
# compatible with immutable releases (an immutable release freezes its assets at
# creation, so a single rolling release can't be appended to). The CLI
# (beetroot.kernel_download) computes the same fingerprint from its local
# src/beetroot/templates/vm/kernel.config and only fetches an exact match — so a config edit
# correctly misses and the CLI falls back to a source compile. Runs on demand
# and whenever the config fragment changes on master.
name: vm-kernel-release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - src/beetroot/templates/vm/kernel.config
      - .github/workflows/vm-kernel-release.yml

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # create the per-fingerprint 'vm-kernel-<ver>-<fp>' release
    env:
      # Keep in sync with KERNEL_VERSION in src/beetroot/builder.py and e2e.yml.
      KERNEL_VERSION: "6.12.9"
      # sha256 of linux-${KERNEL_VERSION}.tar.xz from cdn.kernel.org's signed
      # sha256sums.asc; verified before extract so a tampered CDN tarball can't
      # be compiled into a published bzImage. Keep in sync with
      # KERNEL_SOURCE_SHA256 in src/beetroot/builder.py (issue #184).
      KERNEL_SOURCE_SHA256: "87be0360df0931b340d2bac35161a548070fbc3a8c352c49e21e96666c26aeb4"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install the kernel toolchain + ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc cpio xz-utils ccache

      - name: Cache ccache (guest-kernel compile)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/ccache
          key: >-
            ${{ runner.os }}-ccache-vmkernel-${{ env.KERNEL_VERSION }}-${{
            hashFiles('src/beetroot/templates/vm/kernel.config') }}
          restore-keys: |
            ${{ runner.os }}-ccache-vmkernel-${{ env.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-vmkernel-

      - name: Build the binder-enabled bzImage
        run: |
          set -euxo pipefail
          fp="$(sha256sum src/beetroot/templates/vm/kernel.config | cut -c1-12)"
          asset="bzImage-${KERNEL_VERSION}-${fp}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
          # Verify the pinned source digest BEFORE extract (issue #184).
          echo "${KERNEL_SOURCE_SHA256}  linux-${KERNEL_VERSION}.tar.xz" | sha256sum -c -
          tar -xf "linux-${KERNEL_VERSION}.tar.xz"
          cd "linux-${KERNEL_VERSION}"
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/src/beetroot/templates/vm/kernel.config"
          make olddefconfig
          make CC="ccache gcc" -j"$(nproc)" bzImage
          grep -q 'CONFIG_ANDROID_BINDER_IPC=y' .config
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/${asset}"
          cd "$GITHUB_WORKSPACE"
          sha256sum "${asset}" >"${asset}.sha256"
          {
            echo "ASSET=${asset}"
            echo "FP=${fp}"
            echo "TAG=vm-kernel-${KERNEL_VERSION}-${fp}"
          } >>"$GITHUB_ENV"

      - name: Publish the per-fingerprint vm-kernel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          # Attach the bzImage + sidecar AT creation: immutable releases freeze
          # their assets at creation, so create-with-asset is the only path that
          # works (a later `gh release upload` would 422). Idempotent — an
          # existing release for this fingerprint is already complete, so skip.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; nothing to publish"
          else
            notes="Prebuilt binder: vm guest kernel ${KERNEL_VERSION} (config ${FP}),"
            notes="${notes} fetched by 'beetroot build --vm-kernel'."
            gh release create "${TAG}" "${ASSET}" "${ASSET}.sha256" \
              --title "binder: vm guest kernel ${KERNEL_VERSION} (${FP})" \
              --notes "${notes}"
          fi
