services:
  # Main Android Node
  android-research:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: android-research-lab
    privileged: true
    volumes:
      - ./data:/data
      - ./modules:/flash_dir # Drop Shamiko.zip here
    ports:
      - "5555:5555" # ADB
    command:
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=1920
      - androidboot.redroid_gpu_mode=guest
    restart: unless-stopped

  # Visualizer
  visual-ui:
    image: empty602/ws-scrcpy
    container_name: android-research-ui
    ports:
      - "8000:8000"
    depends_on:
      - android-research
    environment:
      - ADB_SERVER_IP=android-research

