[project]
name = "beetroot"
version = "0.1.0"
description = "Beetroot CLI — the best Android research setup to beat root"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xiddoc" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "typer>=0.12",
    "zstandard>=0.22",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Security",
]

[project.optional-dependencies]
frida = ["frida-tools>=13"]

[project.urls]
Homepage = "https://github.com/Xiddoc/Beetroot"
Repository = "https://github.com/Xiddoc/Beetroot"

[project.scripts]
beetroot = "beetroot.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pytest>=8",
    "pytest-cov",
    "pre-commit>=3.5",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-glightbox",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetroot"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "PL",   # pylint subset
    "PERF", # flake8-perf
    "FURB", # refurb-like checks
    "ERA",  # eradicate (no commented-out code)
    "A",    # flake8-builtins
]
extend-select = ["D213"]  # summary on line after opening """
ignore = [
    "D212",   # multi-line summary on first line — disabled in favour of D213
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests read better with patch + raises as nested withs and tolerate longer
# lines on monkeypatch.setattr calls. Tests don't need full docstring coverage.
# ARG00x — fixtures are often declared for their side-effects (isolated_registry,
#           isolated_instance, cli_root) and lambda stubs can't rename
#           arguments, so unused-arg warnings are endemic in test files.
# PLR2004 — magic numbers in assertions are fine; extracting them to constants
#            makes tests harder to read.
# PLC0415 — some tests do deliberate mid-function imports for monkeypatching.
"tests/*" = ["SIM117", "E501", "D", "ARG001", "ARG002", "ARG005", "PLR2004", "PLC0415"]

[tool.ruff.lint.pylint]
max-statements = 60  # build_parser() wires 12+ subparsers — 50 is too tight

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
extra_checks = true
disallow_any_unimported = true
enable_error_code = ["redundant-self", "redundant-expr", "possibly-undefined", "truthy-bool", "truthy-iterable", "ignore-without-code", "unused-awaitable", "explicit-override", "mutable-override", "unimported-reveal"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=beetroot --cov-report=term-missing"

[tool.coverage.run]
source = ["beetroot"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
